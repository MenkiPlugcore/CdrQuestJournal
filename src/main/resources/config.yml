journal:
  refresh-seconds: 5
  author: "MoonSign S2"
  max-active-quests: 5
  restore-on-join: true
  protect-item: true

journal-ui:
  enabled: true
  crossplay-safe: true
  progress-bar-width: 12
  objectives-per-page: 4
  show-accepted-at: true
  show-cycle-info: true
  item-name: "&6&lQuest Journal &8• &f%quest%"

lifecycle:
  timezone: "Asia/Jakarta"
  daily-reset: "00:00"

npc:
  require-binding-for-start: true
  require-binding-for-turnin: true
  interaction-context-seconds: 60
  bind-look-distance: 8

turn-in:
  allow-legacy-action: false
  prepare-timeout-seconds: 120
  minimum-free-slots: 1
  audit-log: true
  required-free-slots-by-quest: {}

