name: CdrQuestJournal
version: '0.3.0'
main: com.menkiestes.cdrquestjournal.CdrQuestJournalPlugin
api-version: '1.21'
author: CADERA
description: BetonQuest journal bridge for MoonSign S2.
website: https://github.com/MenkiPlugcore/CdrQuestJournal
depend:
  - Citizens
softdepend:
  - BetonQuest
  - CdrReputation

commands:
  cdrjournal:
    aliases: [cqj]
    description: CdrQuestJournal administrator command.
    usage: /cdrjournal <reload|inspect|restore|limited|npc>
    permission: cdrquestjournal.admin

permissions:
  cdrquestjournal.admin:
    description: Allows access to CdrQuestJournal administration commands.
    default: op
