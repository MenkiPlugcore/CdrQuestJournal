name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: mvn -B clean verify

      - name: Validate plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/CdrQuestJournal-1.0.0.jar"
          test -f "$JAR"
          jar tf "$JAR" > jar-contents.txt
          grep -qx 'plugin.yml' jar-contents.txt
          grep -qx 'config.yml' jar-contents.txt
          grep -qx 'quests.yml' jar-contents.txt
          grep -q 'com/menkiestes/cdrquestjournal/CdrQuestJournalPlugin.class' jar-contents.txt
          grep -q 'com/menkiestes/cdrquestjournal/service/ReliabilityService.class' jar-contents.txt
          grep -q 'com/menkiestes/cdrquestjournal/service/TurnInCoordinator.class' jar-contents.txt

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: CdrQuestJournal-1.0.0
          path: target/CdrQuestJournal-1.0.0.jar
